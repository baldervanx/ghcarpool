# ── HTTP ──────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/v1 till backend
    # resolver + variabel i proxy_pass tvingar nginx att re-resolvera DNS
    # vid varje request, annars cachas IP:n vid uppstart och 502 uppstår
    # om backend-kontainern fått ny IP (t.ex. efter docker compose up --build).
    # RESOLVER_PLACEHOLDER ersätts dynamiskt av docker-nginx-setup.sh vid start.
    resolver RESOLVER_PLACEHOLDER valid=10s ipv6=off;
    set $backend_upstream http://backend:3001;

    location /api/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;

        # SSE: stäng av buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS-blocket läggs till av docker-nginx-setup.sh om cert finns.
# Inkluderas via Dockerfile ENTRYPOINT — se nedan.
include /etc/nginx/conf.d/https.conf;
