version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ghcarpool
      POSTGRES_PASSWORD: dev_secret
      POSTGRES_DB: ghcarpool_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghcarpool -d ghcarpool_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
