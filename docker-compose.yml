services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-ghcarpool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-ghcarpool}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghcarpool}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # Exponera PostgreSQL-porten lokalt för DB-verktyg (t.ex. TablePlus, pgAdmin).
    # Sätt POSTGRES_EXPOSE_PORT=5432 i .env för att aktivera — utelämna i produktion.
    ports:
      - "${POSTGRES_EXPOSE_PORT:-}:5432"

  # ── Backend (Node/Express/Prisma) ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:    production
      PORT:        3001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ghcarpool}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ghcarpool}"
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL:   ${FRONTEND_URL:-http://localhost}
      # Sätt COOKIE_SECURE=true om TLS termineras i nginx (HTTPS_PORT satt nedan)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Google OAuth (optionellt — utelämna för att inaktivera)
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL:  ${GOOGLE_CALLBACK_URL:-}
    networks:
      - internal
    expose:
      - "3001"

  # ── Frontend (Vite/React → nginx) ──────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_GOOGLE_AUTH_ENABLED: ${VITE_GOOGLE_AUTH_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
      # HTTPS: sätt HTTPS_PORT=443 och lägg SSL-cert i ./certs/ (se README)
      - "${HTTPS_PORT:-}:443"
    volumes:
      # SSL-certifikat — monteras bara om HTTPS_PORT är satt
      - ${CERTS_DIR:-/dev/null}:/etc/nginx/certs:ro
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
