packages:
  - 'packages/*'

allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  re2: true
  unrs-resolver: true

settings:
  onlyBuiltDependencies:
    - '@firebase/util'
    - '@prisma/client'
    - '@prisma/engines'
    - bcrypt
    - esbuild
    - msw
    - prisma
    - protobufjs
    - re2
    - unrs-resolver
